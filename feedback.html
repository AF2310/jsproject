<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Personal Portfolio</title>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <header>
        <h1>Welcome to my Portfolio</h1>
        <nav>
            <a href="index.html#about">About Me</a> |
            <a href="index.html#projects">My Projects</a> |
            <a href="feedback.html">Feedback</a> |
            <a href="index.html#contact-me">Contact</a>
        </nav>
    </header>

    <main>
        <section id="feedback-form-section" class="section-card">
            <h2>Leave Feedback</h2>
            <!-- The form element for Grade 3 requirements. novalidate disables default browser validation bubbles so we can use custom JS validation. -->
            <form id="feedback-form" novalidate>
                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="full-name" placeholder="e.g. Nora Smith" aria-describedby="name-error" required>
                    <div class="error-message" id="name-error" role="alert"></div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="nora@example.com" aria-describedby="email-error" required>
                    <div class="error-message" id="email-error" role="alert"></div>
                </div>

                <div class="form-group">
                    <label for="topic">Topic of Interest</label>
                    <select id="topic" name="topic" aria-describedby="topic-error" required>
                        <option value="">Select a topic...</option>
                        <option value="art">Art</option>
                        <option value="science">Science</option>
                        <option value="technology">Technology</option>
                    </select>
                    <div class="error-message" id="topic-error" role="alert"></div>
                </div>

                <div class="form-group">
                    <label for="comments">Comments</label>
                    <textarea id="comments" name="comments" rows="4" placeholder="Share your thoughts..." aria-describedby="comments-counter comments-error" required></textarea>
                    <div class="char-counter" id="comments-counter"><span id="char-count">0</span> / 15 (minimum)</div>
                    <div class="error-message" id="comments-error" role="alert"></div>
                </div>

                <div class="form-group">
                    <label for="website">Website (optional)</label>
                    <input type="url" id="website" name="website" placeholder="https://www.example.com" aria-describedby="website-error">
                    <div class="error-message" id="website-error" role="alert"></div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-btn" class="btn btn-primary">Submit</button>
                    <button type="reset" id="clear-btn" class="btn btn-secondary">Clear</button>
                </div>

                <div id="form-status" aria-live="polite"></div>
            </form>
        </section>
    </main>

    <footer>
        <p>Email me at student@example.com</p>
        <p>Copyright 2026</p>
        <p><a href="#">Privacy Policy</a> - <a href="#">Terms</a></p>
    </footer>
    <script src="js/validation.js"></script>
</body>
</html>
